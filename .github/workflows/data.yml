name: Refresh data

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/fetch-data.mjs
      - run: node scripts/fetch-policy.mjs
        env:
          # Free key from https://api.data.gov/signup/; falls back to DEMO_KEY.
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
      - run: node scripts/check-data.mjs
      - name: Commit if changed
        run: |
          git add src/data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "govargus-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "data: weekly refresh $(date -u +%Y-%m-%d)"
          git push
