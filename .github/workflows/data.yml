name: Refresh data

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # A failing source shouldn't throw away what the others fetched: commit
      # whatever succeeded, then fail the run at the end so it still shows.
      - id: data
        run: node scripts/fetch-data.mjs
        continue-on-error: true
      - id: policy
        run: node scripts/fetch-policy.mjs
        continue-on-error: true
        env:
          # Free key from https://api.data.gov/signup/; falls back to DEMO_KEY.
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
      - run: node scripts/check-data.mjs
      # Don't push data the site can't build from: every push to master deploys.
      - run: npm ci && npx astro build
        env:
          ASTRO_TELEMETRY_DISABLED: 1
      - name: Commit if changed
        run: |
          git add src/data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "govargus-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "data: weekly refresh $(date -u +%Y-%m-%d)"
          git push
      - name: Fail if a fetch failed
        if: steps.data.outcome == 'failure' || steps.policy.outcome == 'failure'
        run: |
          echo "data: ${{ steps.data.outcome }}, policy: ${{ steps.policy.outcome }}"
          exit 1
